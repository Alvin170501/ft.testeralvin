<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cari Jawaban Soal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    mark {
      background-color: #fef08a;
      color: #0f172a;
      padding: 0 3px;
      border-radius: 3px;
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header & Kolom Pencarian Utama -->
  <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 sticky top-0 z-30 shadow-lg shadow-black/20">
    <div class="max-w-3xl mx-auto px-4 pt-4 pb-3.5 space-y-3">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shadow-md shadow-indigo-600/30">
            <i class="fa-solid fa-magnifying-glass text-white text-sm"></i>
          </div>
          <div>
            <h1 class="font-bold text-base sm:text-lg leading-tight text-white">Cari Jawaban Soal</h1>
            <p id="statusText" class="text-xs text-slate-400">Menyiapkan database soal...</p>
          </div>
        </div>

        <!-- Indikator Status File (Klik untuk cek soal1 - soal16) -->
        <button
          onclick="toggleStatusModal(true)"
          id="dbBadge"
          class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[11px] font-medium text-slate-300 flex items-center gap-1.5 transition"
          title="Cek status soal1.xlsx - soal16.xlsx"
        >
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="dbDot"></span>
          <span id="dbBadgeLabel">Memuat...</span>
        </button>
      </div>

      <!-- Input Pencarian + Tombol Tempel & Hapus -->
      <div class="relative flex items-center">
        <i class="fa-solid fa-search absolute left-4 text-slate-400 pointer-events-none"></i>
        <input
          type="text"
          id="searchInput"
          placeholder="Ketik kata kunci atau tempel soal di sini..."
          autocomplete="off"
          class="w-full pl-11 pr-24 py-3.5 rounded-2xl bg-slate-800 border border-slate-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 outline-none text-sm sm:text-base text-white placeholder-slate-400 transition"
        />

        <div class="absolute right-2.5 flex items-center gap-1.5">
          <button
            id="pasteBtn"
            onclick="pasteFromClipboard()"
            class="px-2.5 py-1.5 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/30 text-indigo-300 text-xs font-medium flex items-center gap-1 transition"
            title="Tempel soal dari clipboard"
          >
            <i class="fa-regular fa-paste"></i>
            <span>Tempel</span>
          </button>

          <button
            id="clearBtn"
            onclick="clearSearch()"
            class="hidden w-8 h-8 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-200 flex items-center justify-center text-xs transition"
            title="Hapus pencarian"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Area Hasil Pencarian -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-5">
    <div id="resultMeta" class="hidden flex items-center justify-between text-xs text-slate-400 mb-3">
      <span id="resultCountText"></span>
      <span class="text-slate-500">Diurutkan paling mirip</span>
    </div>

    <!-- Container Kartu Soal & Jawaban -->
    <div id="resultsContainer" class="space-y-3.5"></div>

    <!-- Tombol Muat Lebih Banyak -->
    <div id="loadMoreWrap" class="hidden mt-5 text-center">
      <button
        onclick="loadMore()"
        class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-indigo-400 transition"
      >
        Tampilkan hasil lainnya
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-900 py-4 text-center text-xs text-slate-500">
    Developed by <span class="text-slate-400 font-medium">M. Alvian</span> &bull; @alviannnnm
  </footer>

  <!-- Modal Cek Kelengkapan File soal1 - soal16 -->
  <div id="statusModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 shadow-2xl max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h2 class="font-bold text-sm sm:text-base text-white flex items-center gap-2">
          <i class="fa-solid fa-database text-indigo-400"></i>
          Sumber Data (soal1.xlsx - soal16.xlsx)
        </h2>
        <button onclick="toggleStatusModal(false)" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div id="fileGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4 text-xs"></div>

      <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between text-xs">
        <span class="text-slate-400" id="modalSummary"></span>
        <button
          onclick="reloadDatabase()"
          class="text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1.5"
        >
          <i class="fa-solid fa-rotate"></i> Muat Ulang
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notifikasi -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-full bg-emerald-600 text-white text-xs font-medium shadow-xl flex items-center gap-2">
    <i class="fa-solid fa-check-circle"></i>
    <span id="toastMsg">Tersalin!</span>
  </div>

  <script>
    // =========================================================================
    // 1. KONFIGURASI FILE (soal1.xlsx sampai soal16.xlsx)
    // =========================================================================
    const TOTAL_FILES = 16;
    const FILE_NAMES = Array.from({ length: TOTAL_FILES }, (_, i) => `soal${i + 1}.xlsx`);

    // Kata penghubung umum yang bobotnya lebih rendah agar pencocokan fokus pada kata kunci inti
    const STOPWORDS = new Set([
      "apa", "yang", "di", "ke", "dari", "pada", "adalah", "yaitu", "yakni",
      "berikut", "ini", "itu", "tersebut", "manakah", "sebutkan", "jelaskan",
      "dan", "atau", "untuk", "dengan", "dalam", "tidak", "bukan", "jika",
      "maka", "oleh", "sebagai", "suatu", "sebuah", "para", "akan", "dapat",
      "bisa", "harus", "antara", "bawah", "atas", "kecuali", "dimaksud"
    ]);

    let bankSoal = [];
    let fileStatuses = [];
    let currentMatches = [];
    let visibleLimit = 30;
    let debounceTimer = null;

    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const pasteBtn = document.getElementById("pasteBtn");
    const resultsContainer = document.getElementById("resultsContainer");
    const resultMeta = document.getElementById("resultMeta");
    const resultCountText = document.getElementById("resultCountText");
    const loadMoreWrap = document.getElementById("loadMoreWrap");

    // =========================================================================
    // 2. NORMALISASI TEKS & PRE-INDEXING UNTUK PENCARIAN CEPAT
    // =========================================================================
    function normalizeText(str) {
      return String(str ?? "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getBigrams(str) {
      const clean = str.replace(/\s+/g, " ");
      const set = new Set();
      for (let i = 0; i < clean.length - 1; i++) {
        set.add(clean.slice(i, i + 2));
      }
      return set;
    }

    function buildIndexItem(soal, jawaban, sumber) {
      const normSoal = normalizeText(soal);
      const normJawab = normalizeText(jawaban);
      const tokens = normSoal.split(" ").filter(Boolean);
      const coreTokens = tokens.filter(t => t.length > 1 && !STOPWORDS.has(t));

      return {
        soal,
        jawaban,
        sumber,
        normSoal,
        normJawab,
        tokens,
        coreTokens: coreTokens.length > 0 ? coreTokens : tokens,
        bigrams: getBigrams(normSoal)
      };
    }

    // =========================================================================
    // 3. PARSER EXCEL (soal1.xlsx - soal16.xlsx)
    // =========================================================================
    function parseWorkbook(wb, filename) {
      const list = [];
      for (const sheetName of wb.SheetNames) {
        const sheet = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });

        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          if (!Array.isArray(row) || row.length < 2) continue;

          const col0 = String(row[0] ?? "").trim();
          const col1 = String(row[1] ?? "").trim();
          if (!col0 || !col1) continue;

          // Lewati header tabel jika baris 1 bertuliskan "Soal" / "Jawaban"
          if (
            i === 0 &&
            /^(no|nomor|soal|pertanyaan|question|tanya)$/i.test(col0) &&
            /^(soal|pertanyaan|jawaban|jawab|answer|kunci)$/i.test(col1)
          ) {
            continue;
          }

          // Dukung format 3 kolom (No | Soal | Jawaban) maupun 2 kolom (Soal | Jawaban)
          let soalText = col0;
          let jawabText = col1;
          if (/^\d+\.?$/.test(col0) && row[2] !== undefined && String(row[2]).trim() !== "") {
            soalText = col1;
            jawabText = String(row[2]).trim();
          }

          list.push(buildIndexItem(soalText, jawabText, filename));
        }
      }
      return list;
    }

    async function loadDatabase() {
      const statusText = document.getElementById("statusText");
      const dbBadgeLabel = document.getElementById("dbBadgeLabel");
      const dbDot = document.getElementById("dbDot");

      statusText.textContent = "Memuat soal1.xlsx - soal16.xlsx...";
      dbDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";

      const v = Date.now();
      const results = await Promise.all(
        FILE_NAMES.map(async (filename) => {
          try {
            const res = await fetch(`./${filename}?v=${v}`);
            if (!res.ok) throw new Error("Not found");
            const buf = await res.arrayBuffer();
            const wb = XLSX.read(buf, { type: "array" });
            const items = parseWorkbook(wb, filename);
            return { filename, ok: true, count: items.length, items };
          } catch {
            return { filename, ok: false, count: 0, items: [] };
          }
        })
      );

      bankSoal = [];
      fileStatuses = results;
      let activeFiles = 0;

      for (const r of results) {
        if (r.ok && r.count > 0) {
          activeFiles++;
          bankSoal.push(...r.items);
        }
      }

      if (activeFiles > 0) {
        dbDot.className = "w-2 h-2 rounded-full bg-emerald-400";
        dbBadgeLabel.textContent = `${activeFiles}/${TOTAL_FILES} File`;
        statusText.textContent = `${bankSoal.length.toLocaleString("id-ID")} soal siap dicari`;
      } else {
        dbDot.className = "w-2 h-2 rounded-full bg-rose-400";
        dbBadgeLabel.textContent = "0 File";
        statusText.textContent = "File soal1.xlsx - soal16.xlsx belum terbaca";
      }

      renderFileGrid(activeFiles);
      runSearch();
    }

    // =========================================================================
    // 4. ALGORITMA PENCARIAN COCOK & MENDEKATI (HYBRID SIMILARITY)
    // =========================================================================
    function wordSimilarity(a, b) {
      if (a === b) return 1;
      if (a.length < 3 || b.length < 3) return 0;
      if (a.includes(b) || b.includes(a)) {
        return Math.min(a.length, b.length) / Math.max(a.length, b.length);
      }

      // Bigram similarity untuk toleransi typo (misal: "protkol" vs "protokol")
      const biA = getBigrams(a);
      const biB = getBigrams(b);
      if (biA.size === 0 || biB.size === 0) return 0;

      let overlap = 0;
      for (const bg of biA) {
        if (biB.has(bg)) overlap++;
      }
      return (2 * overlap) / (biA.size + biB.size);
    }

    function computeRelevance(queryNorm, qCoreTokens, qBigrams, item) {
      // 1. Cek kecocokan frasa persis (Exact Substring)
      if (item.normSoal.includes(queryNorm)) {
        const lengthRatio = Math.min(1, queryNorm.length / Math.max(item.normSoal.length, 1));
        const score = Math.round(88 + lengthRatio * 12); // 88 - 100%
        return { score, type: score >= 96 ? "exact" : "high" };
      }

      // 2. Cek kecocokan kata-kata inti (mendukung soal panjang & typo)
      let matchedWeight = 0;
      let totalWeight = 0;

      for (const qt of qCoreTokens) {
        const weight = qt.length >= 5 ? 1.5 : 1.0;
        totalWeight += weight;

        let bestWordScore = 0;
        for (const it of item.tokens) {
          const sim = wordSimilarity(qt, it);
          if (sim > bestWordScore) bestWordScore = sim;
          if (bestWordScore === 1) break;
        }

        if (bestWordScore >= 0.65) {
          matchedWeight += weight * bestWordScore;
        }
      }

      const tokenScore = totalWeight > 0 ? (matchedWeight / totalWeight) : 0;

      // 3. Cek kemiripan struktur karakter keseluruhan (Dice Coefficient)
      let bigramOverlap = 0;
      if (qBigrams.size > 0 && item.bigrams.size > 0) {
        for (const bg of qBigrams) {
          if (item.bigrams.has(bg)) bigramOverlap++;
        }
      }
      const diceScore = (qBigrams.size + item.bigrams.size) > 0
        ? (2 * bigramOverlap) / (qBigrams.size + item.bigrams.size)
        : 0;

      // 4. Cek juga apakah kata kunci ada di kolom jawaban (bobot lebih ringan)
      let answerBonus = 0;
      if (item.normJawab.includes(queryNorm) && queryNorm.length >= 4) {
        answerBonus = 0.25;
      }

      // Gabungan skor akhir (0 - 95%)
      const combined = Math.min(0.95, tokenScore * 0.75 + diceScore * 0.25 + answerBonus);
      const percent = Math.round(combined * 100);

      if (percent < 35) return null; // Abaikan yang terlalu jauh tidak relevan

      return {
        score: percent,
        type: percent >= 75 ? "high" : "near"
      };
    }

    function runSearch() {
      const raw = searchInput.value.trim();
      const hasQuery = raw.length > 0;

      clearBtn.classList.toggle("hidden", !hasQuery);
      pasteBtn.classList.toggle("hidden", hasQuery);

      if (!hasQuery) {
        resultMeta.classList.add("hidden");
        loadMoreWrap.classList.add("hidden");
        renderEmptyPrompt();
        return;
      }

      const queryNorm = normalizeText(raw);
      if (!queryNorm) {
        renderEmptyPrompt();
        return;
      }

      const rawTokens = queryNorm.split(" ").filter(Boolean);
      const coreTokens = rawTokens.filter(t => t.length > 1 && !STOPWORDS.has(t));
      const effectiveTokens = coreTokens.length > 0 ? coreTokens : rawTokens;
      const qBigrams = getBigrams(queryNorm);

      const matches = [];
      for (const item of bankSoal) {
        const res = computeRelevance(queryNorm, effectiveTokens, qBigrams, item);
        if (res) {
          matches.push({ item, score: res.score, type: res.type });
        }
      }

      // Urutkan dari kemiripan tertinggi ke terendah
      matches.sort((a, b) => b.score - a.score);

      currentMatches = matches;
      visibleLimit = 30;
      renderMatches(effectiveTokens);
    }

    // =========================================================================
    // 5. RENDER TAMPILAN HASIL & HIGHLIGHT
    // =========================================================================
    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function highlightWords(text, tokens) {
      let safe = escapeHtml(text);
      const validTokens = [...new Set(tokens.filter(t => t.length >= 2))]
        .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
        .sort((a, b) => b.length - a.length);

      if (!validTokens.length) return safe;
      const regex = new RegExp(`(${validTokens.join("|")})`, "gi");
      return safe.replace(regex, "<mark>$1</mark>");
    }

    function renderEmptyPrompt() {
      if (bankSoal.length === 0) {
        resultsContainer.innerHTML = `
          <div class="text-center py-12 px-5 bg-slate-900/70 border border-slate-800 rounded-2xl space-y-2.5">
            <i class="fa-solid fa-folder-open text-3xl text-amber-400"></i>
            <p class="text-sm font-semibold text-slate-200">File soal1.xlsx - soal16.xlsx belum ditemukan</p>
            <p class="text-xs text-slate-400 max-w-md mx-auto leading-relaxed">
              Pastikan file Excel sudah di-upload ke folder utama repository GitHub dan halaman dibuka melalui link GitHub Pages.
            </p>
          </div>
        `;
        return;
      }

      resultsContainer.innerHTML = `
        <div class="text-center py-14 px-5 bg-slate-900/50 border border-slate-800/80 rounded-2xl space-y-3">
          <div class="w-12 h-12 rounded-2xl bg-indigo-600/15 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto">
            <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
          </div>
          <div class="space-y-1">
            <p class="text-sm sm:text-base font-semibold text-slate-200">Ketik atau tempel soal di kolom atas</p>
            <p class="text-xs text-slate-400 max-w-md mx-auto leading-relaxed">
              Otomatis mencari jawaban yang <b>cocok persis</b> maupun <b>soal yang mendekati</b> dari <span class="text-slate-300 font-medium">soal1.xlsx</span> sampai <span class="text-slate-300 font-medium">soal16.xlsx</span>.
            </p>
          </div>
        </div>
      `;
    }

    function renderMatches(highlightTokens) {
      resultMeta.classList.remove("hidden");
      resultCountText.textContent = `Ditemukan ${currentMatches.length} hasil relevan`;

      if (currentMatches.length === 0) {
        loadMoreWrap.classList.add("hidden");
        resultsContainer.innerHTML = `
          <div class="text-center py-14 px-4 bg-slate-900/60 border border-slate-800 rounded-2xl space-y-1.5">
            <i class="fa-regular fa-face-frown text-3xl text-slate-500 mb-1"></i>
            <p class="text-sm font-medium text-slate-300">Tidak ada soal yang cocok atau mendekati</p>
            <p class="text-xs text-slate-500">Coba ketik 2-3 kata kunci utama dari soal tersebut.</p>
          </div>
        `;
        return;
      }

      const slice = currentMatches.slice(0, visibleLimit);
      loadMoreWrap.classList.toggle("hidden", currentMatches.length <= visibleLimit);

      resultsContainer.innerHTML = slice.map(({ item, score, type }) => {
        let badgeHtml = "";
        if (type === "exact") {
          badgeHtml = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30"><i class="fa-solid fa-check"></i> Cocok Persis</span>`;
        } else if (type === "high") {
          badgeHtml = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-sky-500/15 text-sky-300 border border-sky-500/30">Sangat Mirip (${score}%)</span>`;
        } else {
          badgeHtml = `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-semibold bg-amber-500/15 text-amber-300 border border-amber-500/30">Mendekati (${score}%)</span>`;
        }

        return `
          <article class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl p-4 sm:p-5 transition shadow-sm">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <div class="flex items-center gap-1.5">
                ${badgeHtml}
                <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium bg-slate-800 text-slate-400">
                  ${escapeHtml(item.sumber)}
                </span>
              </div>

              <button
                onclick="copyText('${encodeURIComponent(item.jawaban)}')"
                class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5 py-1 px-2.5 rounded-lg hover:bg-indigo-950/50 transition"
              >
                <i class="fa-regular fa-copy"></i>
                <span>Salin Jawaban</span>
              </button>
            </div>

            <p class="mt-2.5 text-sm sm:text-base text-slate-200 leading-relaxed whitespace-pre-line">${highlightWords(item.soal, highlightTokens)}</p>

            <div class="mt-3.5 pt-3 bg-emerald-950/25 px-3.5 py-2.5 rounded-xl border border-emerald-800/40">
              <div class="text-[11px] uppercase tracking-wider font-bold text-emerald-400 mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-circle-check"></i> Jawaban:
              </div>
              <p class="text-sm sm:text-base font-semibold text-emerald-200 leading-relaxed whitespace-pre-line">${highlightWords(item.jawaban, highlightTokens)}</p>
            </div>
          </article>
        `;
      }).join("");
    }

    function loadMore() {
      visibleLimit += 30;
      const queryNorm = normalizeText(searchInput.value);
      const tokens = queryNorm.split(" ").filter(t => t.length > 1 && !STOPWORDS.has(t));
      renderMatches(tokens);
    }

    // =========================================================================
    // 6. EVENT HANDLER & UTILITAS
    // =========================================================================
    searchInput.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(runSearch, 100);
    });

    function clearSearch() {
      searchInput.value = "";
      runSearch();
      searchInput.focus();
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text && text.trim()) {
          searchInput.value = text.trim();
          runSearch();
        } else {
          showToast("Clipboard kosong");
        }
      } catch {
        searchInput.focus();
        showToast("Tekan & tahan di kolom cari lalu pilih Tempel");
      }
    }

    function copyText(encoded) {
      navigator.clipboard.writeText(decodeURIComponent(encoded)).then(() => {
        showToast("Jawaban berhasil disalin!");
      });
    }

    function toggleStatusModal(show) {
      document.getElementById("statusModal").classList.toggle("hidden", !show);
    }

    function renderFileGrid(activeFiles) {
      document.getElementById("modalSummary").textContent = `${activeFiles} dari ${TOTAL_FILES} file aktif`;
      document.getElementById("fileGrid").innerHTML = fileStatuses.map(st => {
        if (st.ok && st.count > 0) {
          return `
            <div class="p-2 rounded-xl bg-emerald-950/40 border border-emerald-800/60">
              <div class="font-semibold text-emerald-300 flex items-center justify-between">
                <span>${st.filename}</span>
                <i class="fa-solid fa-check text-[10px]"></i>
              </div>
              <div class="text-[11px] text-emerald-400/80 mt-0.5">${st.count} soal</div>
            </div>
          `;
        }
        return `
          <div class="p-2 rounded-xl bg-slate-800/50 border border-slate-800 opacity-55">
            <div class="font-medium text-slate-400">${st.filename}</div>
            <div class="text-[11px] text-slate-500 mt-0.5">Kosong</div>
          </div>
        `;
      }).join("");
    }

    function reloadDatabase() {
      toggleStatusModal(false);
      loadDatabase();
      showToast("Memuat ulang file Excel...");
    }

    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").textContent = msg;
      toast.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add("hidden"), 2400);
    }

    loadDatabase();
  </script>
</body>
</html>
